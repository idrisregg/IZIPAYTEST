name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ main ] # Triggers the build every time you push to the main branch

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0' # 👈 Change to '8.0' or '10.0' depending on your app

    - name: Install Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    - name: Publish (Bundles Backend & wwwroot)
      run: dotnet publish --configuration Release --output ./publish --runtime win-x86

    - name: Deploy to MonsterASP.NET via WebDeploy
      uses: rasmusbuchholdt/simply-web-deploy@2.1.0
      with:
        website-name: ${{ secrets.WEBSITE_NAME }}
        server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
        server-username: ${{ secrets.SERVER_USERNAME }}
        server-password: ${{ secrets.SERVER_PASSWORD }}
